        \"title\":{\"label\":\"Rarely loads past the opening screen\"}, \"content\":{\"label\":\"I’ve
        been trying to use this app for several weeks.  Only twice (probably 10% of
        my attempts) have I ever got past the “Please wait while we load the application
        for you” screen.  I’ve let that spinning blue/white circle cook for hours.
        \ It would be much more helpful if at some point the screen changed to an
        explanation as to why the app is stuck and perhaps a recommendation as to
        how to succeed at accomplishing the desired task.  At least wish me a nice
        day or tell me to piss off, but to keep spinning is just annoying.  My only
        recourse is pressing the blue “FEEDBACK” button, which I’ve done many times.
        \ Feedback feels like I’m talking to teenage daughters: I provide input but
        receive an eye roll with no anticipated behavior modification. The two times
        I got past the opening screen were productive—I like the app when it works,
        but 10% success is unsat.  \U0001F601 Have a nice day!\", \"attributes\":{\"type\":\"text\"}},
