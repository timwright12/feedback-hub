        \"title\":{\"label\":\"Separation Pay Recoupment\"}, \"content\":{\"label\":\"We
        think it is disrespectful that the VA takes money back from a veteran that
        was given to him 33 years ago for involuntary release of service. Then when
        finally receiving 100% disability after trying for 10 years, they take it
        all away for 5 months due to some law that shouldn’t even be on the books.
        Any veteran who is still suffering from injuries sustained during military
        service after all these years should not be treated this way.\", \"attributes\":{\"type\":\"text\"}},
