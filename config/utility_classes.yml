btn:
  base: "inline-flex justify-center items-center border border-transparent font-medium rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 cursor-pointer px-4 py-2 text-sm rounded-md disabled:cursor-not-allowed disabled:opacity-75 px-3 py-2 text-sm rounded-md"
  green: "text-white bg-green-600 hover:bg-green-700 focus:ring-green-500 border-transparent disabled:hover:bg-green-600"
  blue:  "text-white bg-blue-600 hover:bg-blue-700 focus:ring-blue-500 border-transparent disabled:hover:bg-blue-600"
select: "mt-2 block rounded-md border-0 py-1.5 pl-3 pr-10 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-green-600 sm:text-sm sm:leading-6"
link: "font-semibold text-indigo-600 hover:text-indigo-500"
input:
  text_field: 'block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6'